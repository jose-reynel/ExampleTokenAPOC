server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm application/octet-stream;

    # SPA: cualquier ruta desconocida vuelve a index.html (Blazor enruta en el cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Configuración que se genera al arrancar el contenedor
    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }
}
